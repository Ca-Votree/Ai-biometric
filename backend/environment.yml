name: biometrics
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10

  # AI
  - numpy>=1.24,<2.0
  - opencv>=4.8
  - pillow>=10.0
  - faiss-cpu>=1.7.4
  # - faiss-gpu>=1.7.4  

  # Pip packages
  - pip
  - pip:
      # AI
      - insightface>=0.7.3
      - onnxruntime>=1.16.0
      # Dùng onnxruntime-gpu thay thế dòng trên nếu có CUDA

      # Web Framework
      - fastapi>=0.104.0
      - uvicorn[standard]>=0.24.0
      - python-multipart>=0.0.6
      - jinja2>=3.1.2
      - websockets>=12.0

      # Database
      - sqlalchemy>=2.0.0
      - aiosqlite>=0.19.0

      # Utilities
      - python-dotenv>=1.0.0
      - pydantic>=2.0.0
      - pydantic-settings>=2.0.0
      - loguru>=0.7.0

      # Development
      - pytest>=7.4.0
      - httpx>=0.25.0
