<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nhật ký hoạt động quản trị">
    <title>AI Biometrics - Nhật ký hoạt động</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><div class="brand-icon"><ion-icon name="finger-print-outline" aria-hidden="true"></ion-icon></div><div><h1>AI Biometrics</h1><span class="brand-sub">Khu vực quản trị</span></div></div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="/admin.html" class="nav-link"><span class="nav-icon"><ion-icon name="grid-outline" aria-hidden="true"></ion-icon></span><span>Tổng quan</span></a></li>
                <li class="nav-item"><a href="/admin-teachers.html" class="nav-link"><span class="nav-icon"><ion-icon name="people-outline" aria-hidden="true"></ion-icon></span><span>Tài khoản giảng viên</span></a></li>
                <li class="nav-item"><a href="/admin-classes.html" class="nav-link"><span class="nav-icon"><ion-icon name="business-outline" aria-hidden="true"></ion-icon></span><span>Lớp &amp; camera</span></a></li>
                <li class="nav-item"><a href="/admin-students.html" class="nav-link"><span class="nav-icon"><ion-icon name="school-outline" aria-hidden="true"></ion-icon></span><span>Sinh viên</span></a></li>
                <li class="nav-item"><a href="/admin-schedules.html" class="nav-link"><span class="nav-icon"><ion-icon name="calendar-outline" aria-hidden="true"></ion-icon></span><span>Lịch học</span></a></li>
                <li class="nav-item"><a href="/admin-settings.html" class="nav-link"><span class="nav-icon"><ion-icon name="options-outline" aria-hidden="true"></ion-icon></span><span>Cấu hình hệ thống</span></a></li>
                <li class="nav-item"><a href="/admin-audit.html" class="nav-link active" aria-current="page"><span class="nav-icon"><ion-icon name="list-outline" aria-hidden="true"></ion-icon></span><span>Nhật ký hoạt động</span></a></li>
                <li class="nav-item"><a href="/admin-backup.html" class="nav-link"><span class="nav-icon"><ion-icon name="cloud-download-outline" aria-hidden="true"></ion-icon></span><span>Sao lưu</span></a></li>
            </ul>
            <div class="sidebar-footer"><div class="system-status"><span class="status-dot"></span><span>Hệ thống sẵn sàng</span></div></div>
        </aside>
        <main class="main-content">
            <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Mở menu điều hướng"><ion-icon name="menu-outline" aria-hidden="true"></ion-icon></button>
            <div class="page-header"><div><h2 class="page-title">Nhật ký hoạt động</h2><p class="page-subtitle">Theo dõi các hoạt động quản trị và thay đổi dữ liệu.</p></div><button class="btn btn-outline" type="button" onclick="loadAuditLogs()">Làm mới</button></div>
            <section class="card"><div id="auditLogList" class="admin-class-list" aria-live="polite"><p class="text-muted">Đang tải nhật ký...</p></div></section>
        </main>
    </div>
    <script src="/static/js/api.js"></script>
    <script>
        async function loadAuditLogs() {
            try {
                const data = await apiFetch('/api/audit-logs');
                const list = document.getElementById('auditLogList');
                list.innerHTML = data.logs.length ? data.logs.map(log => `
                    <div class="admin-class-item">
                        <strong>${escapeHtml(log.action)} · ${escapeHtml(log.actor || 'Hệ thống')}</strong>
                        <div>${escapeHtml(log.entity_type || '')} ${escapeHtml(log.entity_id || '')} · ${new Date(log.created_at).toLocaleString('vi-VN')}</div>
                        <div>${escapeHtml(log.details || '')}</div>
                    </div>
                `).join('') : '<p class="text-muted">Chưa có nhật ký hoạt động.</p>';
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
        loadAuditLogs();
    </script>
</body>
</html>
